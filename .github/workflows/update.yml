name: Update dashboard

on:
  schedule:
    # 11:15 UTC = 4:45 PM IST, Monday-Friday (after NSE close)
    - cron: "15 11 * * 1-5"
  push:
    # runs right after you import new holdings from the dashboard
    paths: ["holdings.enc.json"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy cryptography requests
      - run: python scripts/update.py
        env:
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      - name: Telegram action alerts and daily summary
        continue-on-error: true
        run: python scripts/alerts.py evening
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Commit data
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.enc.json state.enc.json
          git ls-files --error-unmatch holdings.enc.json >/dev/null 2>&1 || git add holdings.enc.json
          [ -f isin.json ] && git add isin.json
          git diff --cached --quiet && exit 0
          git commit -m "Daily data update"
          git pull --rebase -X theirs || true
          git push
      - name: Telegram alert if the update failed
        if: failure()
        run: |
          [ -z "$TELEGRAM_TOKEN" ] && exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="❗ Dashboard update failed today. Numbers may be out of date. Check the latest run under Actions on GitHub." > /dev/null
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
