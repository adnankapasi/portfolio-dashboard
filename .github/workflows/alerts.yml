name: Telegram alerts

on:
  schedule:
    # GitHub may start scheduled runs late; the script skips briefs that would arrive stale
    - cron: "37 2 * * 1-5"   # 8:07 AM IST, Monday-Friday: morning brief
    - cron: "53 2 * * 6"     # 8:23 AM IST, Saturday: weekly review
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send a test message · chatid = show your chat ID in the log · morning · weekly"
        required: true
        default: test
        type: choice
        options: [test, chatid, morning, weekly]

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy cryptography requests
      - name: Send
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "53 2 * * 6" ]; then MODE=weekly; else MODE=morning; fi
          fi
          python scripts/alerts.py "$MODE"
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
