name: Telegram alerts

on:
  # Started on time by cron-job.org (morning 8:07 AM Mon-Fri, weekly 8:23 AM Sat).
  # GitHub's own timer was removed: it delayed the morning brief by hours.
  workflow_dispatch:
    inputs:
      mode:
        description: "test = send a test message · chatid = show your chat ID in the log · morning · weekly"
        required: true
        default: test
        type: choice
        options: [test, chatid, morning, weekly]

permissions:
  contents: read

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy cryptography requests
      - name: Send
        run: |
          MODE="${{ github.event.inputs.mode }}"
          python scripts/alerts.py "$MODE"
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
