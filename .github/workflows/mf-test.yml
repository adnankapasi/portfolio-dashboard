name: Mutual fund dip test

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: dashboard-update
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python scripts/mf_dip_test.py
      - name: Save results
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add mf_test.json mf_test_summary.md
          git diff --cached --quiet && exit 0
          git commit -m "Mutual fund dip test results"
          git pull --rebase -X theirs || true
          git push
