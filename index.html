<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">
<title>Portfolio</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--card2:#1e222b;--line:#272c36;--text:#e8eaef;--mute:#8d94a3;--faint:#5d6472;
--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b82f6;--violet:#8b7cf6;
--gbg:#0f2e1c;--rbg:#3a1515;--abg:#3a2a0c;--bbg:#132544}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:auto;padding:12px 14px 96px}
.top{display:flex;justify-content:space-between;align-items:center;padding:6px 0 10px}
.top h1{font-size:19px;margin:0;font-weight:650}
.mute{color:var(--mute);font-size:12px}.faint{color:var(--faint);font-size:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.big{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.pos{color:var(--green)}.neg{color:var(--red)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{background:var(--card2);border-radius:10px;padding:10px}
.mini b{display:block;font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
h2{font-size:14px;font-weight:600;margin:18px 2px 8px;color:var(--mute)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.click{cursor:pointer}.click:active{opacity:.7}
.sym{font-weight:650}.tag{font-size:10px;color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:1px 5px;margin-left:4px;font-weight:500}
.r{text-align:right;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;margin-bottom:6px;font-size:13px}
.a-g{background:var(--gbg);color:#a7f3c4}.a-r{background:var(--rbg);color:#fecaca}.a-a{background:var(--abg);color:#fde68a}.a-n{background:var(--card2);color:var(--mute)}.a-b{background:var(--bbg);color:#bfdbfe}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-size:12.5px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.badge{font-size:11px;font-weight:650;padding:3px 8px;border-radius:999px;white-space:nowrap}
.b-add{background:var(--gbg);color:#86efac}.b-hold{background:#123524;color:#bbf7d0}.b-wait{background:var(--abg);color:#fde68a}.b-noadd{background:#2a2f3a;color:#cbd5e1}.b-exit{background:var(--rbg);color:#fecaca}
input[type=text],input[type=password],input[type=search]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:15px}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.btn2{padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);cursor:pointer;font-size:13px}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(15,17,21,.96);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 0 calc(6px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
nav div{display:flex;max-width:760px;width:100%;justify-content:space-around}
nav button{background:none;border:0;color:var(--faint);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;padding:4px 8px}
nav button svg{width:22px;height:22px}nav button.on{color:var(--text)}
.sheet{position:fixed;inset:0;background:var(--bg);overflow-y:auto;z-index:20;display:none}
.sheet .wrap{padding-bottom:40px}
.bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--card2)}
.seg{display:flex;gap:4px}.seg button{flex:1;background:none;border:0;color:var(--faint);font-size:12px;padding:6px 0;cursor:pointer;border-radius:8px}.seg button.on{background:var(--card2);color:var(--text)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}table.t td{padding:6px 4px;border-top:1px solid var(--line)}
.err{color:var(--amber);font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="lockwrap">
  <form id="lock" class="card" style="max-width:360px;margin:18vh auto 0;text-align:center">
    <div style="font-size:30px">🔒</div>
    <div style="font-weight:650;margin:6px 0 12px">Portfolio dashboard</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password">
    <label class="mute" style="display:block;margin:10px 0"><input type="checkbox" id="rem" checked> Remember on this device</label>
    <button class="btn">Unlock</button>
    <div id="lockmsg" class="mute" style="margin-top:10px">Loading…</div>
  </form>
</div>

<div id="app" class="hidden">
  <div class="wrap">
    <div class="top"><div><h1 id="title">Home</h1><div class="faint" id="upd"></div></div>
      <button class="btn2" id="importBtn" title="Import holdings">⇪ Import</button></div>
    <section id="tab-home"></section>
    <section id="tab-holdings" class="hidden"></section>
    <section id="tab-signals" class="hidden"></section>
    <section id="tab-health" class="hidden"></section>
    <section id="tab-market" class="hidden"></section>
    <div class="err" id="err"></div>
    <p class="faint" style="margin-top:24px">Signals are rule-based reminders from your trigger levels, not financial advice. Prices: NSE/BSE official close, Yahoo for history.</p>
  </div>
  <nav><div id="nav"></div></nav>
</div>

<div class="sheet" id="detail"><div class="wrap" id="detailBody"></div></div>
<div class="sheet" id="import"><div class="wrap" id="importBody"></div></div>

<script>
// ---------- helpers
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const inr = (n, sign) => n == null ? "–" : (n < 0 ? "−" : sign && n > 0 ? "+" : "") + "₹" + Math.abs(Math.round(n)).toLocaleString("en-IN");
const num = (n, d = 2) => n == null ? "–" : Number(n).toLocaleString("en-IN", {maximumFractionDigits: d, minimumFractionDigits: d});
const pc = (n, d = 2) => n == null ? "–" : (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n).toFixed(d) + "%";
const cls = n => n > 0 ? "pos" : n < 0 ? "neg" : "";
const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }, del: k => { try { localStorage.removeItem(k); } catch {} } };
const SIG_ORDER = {exit: 0, add: 1, wait: 2, hold: 3, noadd: 4};
const badge = h => `<span class="badge b-${h.sig}">${esc(h.signal)}</span>`;
const ICONS = {
  home: '<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  holdings: '<path d="M4 6h16M4 12h16M4 18h16"/>',
  signals: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
  health: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
  market: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'};

// ---------- crypto (matches scripts/update.py)
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64e = b => btoa(String.fromCharCode(...new Uint8Array(b)));
async function aesKey(pw, salt, iter) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt, iterations: iter, hash: "SHA-256"}, base,
    {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
}
async function decrypt(blob, pw) {
  const key = await aesKey(pw, b64d(blob.salt), blob.iter);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b64d(blob.iv)}, key, b64d(blob.ct))));
}
async function encrypt(obj, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12)), iter = 310000;
  const ct = await crypto.subtle.encrypt({name: "AES-GCM", iv}, await aesKey(pw, salt, iter), new TextEncoder().encode(JSON.stringify(obj)));
  return {v: 1, iter, salt: b64e(salt), iv: b64e(iv), ct: b64e(ct)};
}

// ---------- charts (plain SVG)
function line(vals, {w = 300, h = 60, color, fill = false, levels = []} = {}) {
  const v = vals.filter(x => x != null);
  if (v.length < 2) return `<div class="faint" style="height:${h}px;display:flex;align-items:center">Chart appears after a few days of data</div>`;
  const all = v.concat(levels.map(l => l.v));
  const lo = Math.min(...all), hi = Math.max(...all), rng = (hi - lo) || 1;
  const x = i => (i / (vals.length - 1) * w).toFixed(1), y = n => (h - 4 - (n - lo) / rng * (h - 8)).toFixed(1);
  const pts = vals.map((n, i) => n == null ? null : `${x(i)},${y(n)}`).filter(Boolean).join(" ");
  const col = color || (v[v.length - 1] >= v[0] ? "#22c55e" : "#ef4444");
  const lv = levels.map(l => `<line x1="0" x2="${w}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-dasharray="4 4" stroke-width="1"/>`).join("");
  const area = fill ? `<polygon fill="${col}" opacity=".12" points="0,${h} ${pts} ${w},${h}"/>` : "";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">${lv}${area}<polyline fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" points="${pts}"/></svg>`;
}
function candles(ch, levels) {
  const n = ch.c.length, w = 600, h = 240, pad = 4;
  const vals = [...ch.h, ...ch.l, ...ch.ema, ...levels.map(l => l.v)].filter(x => x != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), rng = (hi - lo) || 1;
  const y = v => (pad + (hi - v) / rng * (h - 2 * pad)).toFixed(1), step = w / n, bw = Math.max(1.5, step * .6);
  let s = levels.map(l => `<line x1="0" x2="${w}" y1="${y(l.v)}" y2="${y(l.v)}" stroke="${l.c}" stroke-dasharray="6 5" stroke-width="1.2"/>
    <text x="${w - 4}" y="${+y(l.v) - 4}" text-anchor="end" fill="${l.c}" font-size="13">${esc(l.t)} ${num(l.v)}</text>`).join("");
  for (let i = 0; i < n; i++) {
    const o = ch.o[i], c = ch.c[i], up = c >= o, col = up ? "#22c55e" : "#ef4444", cx = (i + .5) * step;
    s += `<line x1="${cx}" x2="${cx}" y1="${y(ch.h[i])}" y2="${y(ch.l[i])}" stroke="${col}" stroke-width="1"/>
      <rect x="${cx - bw / 2}" y="${y(Math.max(o, c))}" width="${bw}" height="${Math.max(1, Math.abs(y(o) - y(c)))}" fill="${col}"/>`;
  }
  const path = arr => arr.map((v, i) => v == null ? null : `${((i + .5) * step).toFixed(1)},${y(v)}`).filter(Boolean).join(" ");
  s += `<polyline fill="none" stroke="#8b7cf6" stroke-width="1.6" points="${path(ch.ema)}"/>`;
  if (ch.sma.some(v => v != null)) s += `<polyline fill="none" stroke="#f59e0b" stroke-width="1.4" points="${path(ch.sma)}"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;display:block">${s}</svg>`;
}
function donut(parts) {
  const tot = parts.reduce((t, p) => t + p.v, 0) || 1, cols = ["#8b7cf6", "#22c55e", "#f59e0b", "#3b82f6", "#ef4444", "#14b8a6", "#ec4899", "#a3a3a3", "#84cc16", "#f97316"];
  let off = 25, s = "";
  parts.forEach((p, i) => { p.c = cols[i % cols.length]; const len = p.v / tot * 100;
    s += `<circle cx="21" cy="21" r="15.9" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${off}"/>`; off -= len; });
  return `<svg viewBox="0 0 42 42" width="120" height="120">${s}</svg>`;
}

// ---------- state
let D = null, PW = null, TAB = "home", BROKER = "All", SORT = {k: "pnl_pct", dir: -1}, Q = "", RANGE = "1M";
const TABS = [["home", "Home"], ["holdings", "Holdings"], ["signals", "Signals"], ["health", "Health"], ["market", "Market"]];

function combined() { // positions merged across brokers, for weights and concentration
  const m = {};
  D.holdings.forEach(h => { const x = m[h.symbol] ||= {symbol: h.symbol, value: 0, invested: 0, sector: h.sector, group: h.group};
    x.value += h.value; x.invested += h.invested; });
  return Object.values(m);
}
function attention() {
  const A = [], tv = D.summary.value;
  D.holdings.forEach(h => {
    const tag = `<b>${esc(h.symbol)}</b>${D.holdings.filter(x => x.symbol === h.symbol).length > 1 ? ` <span class="tag">${h.broker}</span>` : ""}`;
    if (h.sig === "exit") A.push({p: 0, c: "a-r", i: "⛔", t: `${tag} closed ${num(h.close)}, below exit ${num(h.stop_below)}`, s: h.symbol});
    else if (h.sig === "add") A.push({p: 1, c: "a-g", i: "🎯", t: `${tag} closed above ${num(h.add_above)}: add zone`, s: h.symbol});
    else {
      if (h.add_above && h.close < h.add_above && (h.add_above / h.close - 1) * 100 <= 2)
        A.push({p: 2, c: "a-b", i: "↗", t: `${tag} is ${pc((h.add_above / h.close - 1) * 100, 1).slice(1)} from add level ${num(h.add_above)}`, s: h.symbol});
      if (h.stop_below && (h.close / h.stop_below - 1) * 100 <= 2)
        A.push({p: 1, c: "a-r", i: "⚠", t: `${tag} is ${pc((h.close / h.stop_below - 1) * 100, 1).slice(1)} above exit ${num(h.stop_below)}`, s: h.symbol});
    }
    if (Math.abs(h.day_pct) >= 3) A.push({p: 3, c: "a-a", i: h.day_pct > 0 ? "▲" : "▼", t: `${tag} ${pc(h.day_pct, 1)} today · big move`, s: h.symbol});
  });
  combined().forEach(x => { if (x.value / tv > .10 && x.group !== "Gold / Silver") A.push({p: 4, c: "a-a", i: "◔", t: `<b>${esc(x.symbol)}</b> is ${(x.value / tv * 100).toFixed(1)}% of your portfolio (limit 10%)`}); });
  const sec = {}; combined().forEach(x => sec[x.sector] = (sec[x.sector] || 0) + x.value);
  Object.entries(sec).forEach(([s, v]) => {
    const p = v / tv * 100;
    if (s === "Gold and silver" && p > 15) A.push({p: 4, c: "a-a", i: "◔", t: `Gold and silver is ${p.toFixed(1)}% of your portfolio (limit 15%)`});
    else if (s !== "Gold and silver" && s !== "Other" && p > 25) A.push({p: 4, c: "a-a", i: "◔", t: `${esc(s)} is ${p.toFixed(1)}% of your portfolio (limit 25%)`});
  });
  return A.sort((a, b) => a.p - b.p);
}

// ---------- tabs
function renderHome() {
  const s = D.summary, hr = new Date().getHours();
  const greet = hr < 12 ? "Good morning" : hr < 17 ? "Good afternoon" : "Good evening";
  const H = D.history || [], days = {"1W": 7, "1M": 31, "3M": 93, "1Y": 366, "All": 1e5}[RANGE];
  const cut = new Date(Date.now() - days * 864e5).toISOString().slice(0, 10);
  const hv = H.filter(x => x.d >= cut);
  const first = hv[0], chg = first && hv.length > 1 ? s.value - first.v - (s.invested - first.i) : null;
  const A = attention();
  const byDay = [...D.holdings].sort((a, b) => b.day_pct - a.day_pct);
  const mv = (h) => `<div class="row click" data-s="${esc(h.symbol)}"><span>${esc(h.symbol)}</span><span class="${cls(h.day_pct)}">${pc(h.day_pct)}</span></div>`;
  $("tab-home").innerHTML = `
  <div class="mute" style="margin:-4px 2px 10px">${greet} · prices as of ${esc(D.price_date)}</div>
  <div class="card">
    <div class="mute">Total value · all accounts</div>
    <div class="big">${inr(s.value)}</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-size:13px">
      <span class="${cls(s.day)}">Today ${inr(s.day, 1)} (${pc(s.day_pct)})</span>
      <span class="${cls(s.pnl)}">Overall ${inr(s.pnl, 1)} (${pc(s.pnl_pct)})</span></div>
    <div style="margin-top:12px">${line(hv.map(x => x.v), {h: 70, fill: true})}</div>
    <div class="seg" id="range">${["1W", "1M", "3M", "1Y", "All"].map(r => `<button class="${r === RANGE ? "on" : ""}" data-r="${r}">${r}</button>`).join("")}</div>
    ${chg != null ? `<div class="faint" style="margin-top:4px">P&amp;L change over ${RANGE === "All" ? "all tracked days" : RANGE}: <span class="${cls(chg)}">${inr(chg, 1)}</span></div>` : `<div class="faint">Your value chart builds up from today, one point per trading day.</div>`}
  </div>
  <div class="g2">${Object.entries(D.brokers).map(([b, x]) => `<div class="mini click" data-b="${b}"><span class="mute">${b}</span><b>${inr(x.value)}</b>
    <div class="${cls(x.pnl)}" style="font-size:12px">${pc(x.pnl_pct, 1)} · ${inr(x.pnl, 1)}</div><div class="${cls(x.day)}" style="font-size:12px">Today ${inr(x.day, 1)}</div></div>`).join("")}</div>
  <h2>Needs your attention · ${A.length}</h2>
  ${A.length ? A.slice(0, 8).map(a => `<div class="alert ${a.c} ${a.s ? "click" : ""}" ${a.s ? `data-s="${esc(a.s)}"` : ""}><span>${a.i}</span><div>${a.t}</div></div>`).join("") + (A.length > 8 ? `<div class="faint">+${A.length - 8} more in Signals</div>` : "") : `<div class="alert a-n">Nothing needs action today.</div>`}
  <div class="g2" style="margin-top:14px">
    <div class="card" style="margin:0"><div class="mute">Top gainers today</div>${byDay.slice(0, 3).map(mv).join("")}</div>
    <div class="card" style="margin:0"><div class="mute">Top losers today</div>${byDay.slice(-3).reverse().map(mv).join("")}</div></div>`;
  $("range").onclick = e => { if (e.target.dataset.r) { RANGE = e.target.dataset.r; renderHome(); } };
  $("tab-home").querySelectorAll("[data-b]").forEach(el => el.onclick = () => { BROKER = el.dataset.b; go("holdings"); });
}

const SORTS = [["pnl_pct", "P&L %", -1], ["pnl", "P&L ₹", -1], ["day_pct", "Day %", -1], ["value", "Value", -1],
  ["w", "Weight", -1], ["breakeven_pct", "Break-even", 1], ["sig", "Signal", 1], ["symbol", "Name", 1]];
function renderHoldings() {
  const tv = D.summary.value, brokers = ["All", ...Object.keys(D.brokers)];
  let L = D.holdings.map(h => ({...h, w: h.value / tv * 100}))
    .filter(h => (BROKER === "All" || h.broker === BROKER) && (!Q || h.symbol.toLowerCase().includes(Q.toLowerCase()) || (h.fund?.name || "").toLowerCase().includes(Q.toLowerCase())));
  const k = SORT.k, d = SORT.dir;
  L.sort((a, b) => k === "symbol" ? d * a.symbol.localeCompare(b.symbol) : k === "sig" ? d * (SIG_ORDER[a.sig] - SIG_ORDER[b.sig]) : d * (a[k] - b[k]));
  const inv = L.reduce((t, h) => t + h.invested, 0), val = L.reduce((t, h) => t + h.value, 0), day = L.reduce((t, h) => t + h.day_pnl, 0);
  const sub = h => k === "w" ? `${h.w.toFixed(1)}% of portfolio` : k === "breakeven_pct" ? (h.breakeven_pct > 0 ? `needs ${pc(h.breakeven_pct, 1)} to break even` : "in profit")
    : k === "value" ? `value ${inr(h.value)}` : k === "day_pct" ? `today ${inr(h.day_pnl, 1)}` : `${h.qty} @ ${num(h.avg)} · LTP ${num(h.close)}`;
  $("tab-holdings").innerHTML = `
  <div class="card" style="padding:10px 14px"><div class="g2" style="gap:6px">
    <div><span class="mute">Invested</span><div>${inr(inv)}</div></div><div class="r"><span class="mute">Current</span><div>${inr(val)}</div></div>
    <div><span class="mute">P&amp;L</span><div class="${cls(val - inv)}">${inr(val - inv, 1)} (${pc(inv ? (val / inv - 1) * 100 : 0)})</div></div>
    <div class="r"><span class="mute">Today</span><div class="${cls(day)}">${inr(day, 1)}</div></div></div></div>
  <div class="chips" id="bchips">${brokers.map(b => `<button class="chip ${b === BROKER ? "on" : ""}" data-b="${b}">${b}</button>`).join("")}</div>
  <div style="margin:8px 0"><input type="search" id="q" placeholder="Search stock" value="${esc(Q)}"></div>

function repoInfo() {
  const saved = store.get("dash_repo"); if (saved) return saved;
  const owner = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
  return location.hostname.endsWith("github.io") && repo ? `${owner}/${repo}` : "";
}
async function loadXLSX() { if (window.XLSX) return; await new Promise((ok, bad) => { const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"; s.onload = ok; s.onerror = () => bad(new Error("Couldn't load the Excel reader")); document.head.appendChild(s); }); }
async function parseFile(file) {
  let rows;
  if (/\.csv$/i.test(file.name)) {
    const text = await file.text();
    rows = text.split(/\r?\n/).map(l => { const out = []; let cur = "", q = false;
      for (const ch of l) { if (ch === '"') q = !q; else if (ch === "," && !q) { out.push(cur); cur = ""; } else cur += ch; } out.push(cur); return out.map(c => c.trim()); });
  } else { await loadXLSX(); const wb = XLSX.read(await file.arrayBuffer()); rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header: 1, raw: true, defval: ""}); }
  const norm = s => String(s).toLowerCase().replace(/[^a-z]/g, "");
  const hi = rows.findIndex(r => r.some(c => /qty|quantity/.test(norm(c))) && r.some(c => /avg|average/.test(norm(c))));
  if (hi < 0) throw new Error("Couldn't find the holdings table. Upload the holdings file exported from Kite or Groww.");
  const H = rows[hi].map(norm), col = res => { for (const re of res) { const i = H.findIndex(h => re.test(h)); if (i >= 0) return i; } return -1; };
  const cSym = col([/^(symbol|instrument|tradingsymbol|scrip|scripcode)$/, /symbol|instrument/]);
  const cName = col([/stockname|companyname|^name$|securityname/]), cIsin = col([/^isin/]);
  const cQty = col([/^(qty|quantity|quantityavailable|totalquantity|netqty)$/, /qty|quantity/]);
  const cAvg = col([/^(avgcost|averageprice|avgprice|averagebuyprice|averagecost|buyavg)$/, /avg|average/]);
  let map = {}; try { map = await (await fetch("isin.json?" + Date.now())).json(); } catch {}
  const out = [];
  for (const r of rows.slice(hi + 1)) {
    const qty = parseFloat(String(r[cQty]).replace(/,/g, "")), avg = parseFloat(String(r[cAvg]).replace(/,/g, ""));
    let sym = cSym >= 0 ? String(r[cSym]).trim().toUpperCase().replace(/[-#*].*$/, "") : "";
    const isin = cIsin >= 0 ? String(r[cIsin]).trim() : "", name = cName >= 0 ? String(r[cName]).trim() : "";
    if (!sym && isin) sym = map[isin] || "";
    if (!(qty > 0) || !(avg > 0) || (!sym && !isin)) continue;
    out.push({symbol: sym || null, isin: isin || undefined, name, qty, avg: Math.round(avg * 100) / 100});
  }
  if (!out.length) throw new Error("No holdings rows found in that file.");
  return out;
}
async function gh(path, opts = {}) {
  const r = await fetch(`https://api.github.com/repos/${repoInfo()}/${path}`, {...opts, headers: {Authorization: `Bearer ${store.get("dash_token")}`,
    Accept: "application/vnd.github+json", ...(opts.headers || {})}});
  if (!r.ok) throw new Error(`GitHub said ${r.status}. ${r.status === 401 || r.status === 403 || r.status === 404 ? "Check your token and its repository access." : ""}`);
  return r.json();
}

    $("iprev").innerHTML = `<div class="card"><div class="mute">3 · Check and save · ${PARSED.length} holdings for <b>${esc(b)}</b></div>
      <div class="alert a-a" style="margin-top:8px"><span>⚠</span><div>This replaces all your <b>${esc(b)}</b> holdings on the dashboard. Other accounts aren't touched.</div></div>
      <table class="t" style="margin-top:6px"><tr class="faint"><td>Stock</td><td class="r">Qty</td><td class="r">Avg</td><td class="r">Change</td></tr>
      ${PARSED.map(p => { const o = old[p.symbol]; const c = !o ? `<span class="pos">new</span>` : (o.qty !== p.qty || Math.abs(o.avg - p.avg) > .01) ? `<span style="color:var(--amber)">was ${o.qty} @ ${num(o.avg)}</span>` : `<span class="faint">same</span>`;
        return `<tr><td>${esc(p.symbol || p.name || p.isin)}${p.symbol ? "" : ` <span class="err">(symbol found on next update)</span>`}</td><td class="r">${p.qty}</td><td class="r">${num(p.avg)}</td><td class="r">${c}</td></tr>`; }).join("")}
      ${gone.map(s => `<tr><td>${esc(s)}</td><td class="r">–</td><td class="r">–</td><td class="r neg">removed</td></tr>`).join("")}</table>
      <button class="btn" id="isave" style="margin-top:12px">Save ${esc(b)} holdings</button></div>`;
    $("imsg").textContent = "";
    $("isave").onclick = async () => {
      if (!store.get("dash_token")) { $("imsg").innerHTML = `<span class="err">Add your GitHub token below first.</span>`; return; }
      try {
        $("isave").disabled = true; $("imsg").textContent = "Saving…";
        const file = await gh("contents/holdings.enc.json");
        const cfg = await decrypt(JSON.parse(atob(file.content.replace(/\n/g, ""))), PW);
        const keep = cfg.holdings.filter(h => (h.broker || "Kite") !== b);
        const prevB = Object.fromEntries(cfg.holdings.filter(h => (h.broker || "Kite") === b && h.symbol).map(h => [h.symbol, h]));
        const fresh = PARSED.map(p => { const o = prevB[p.symbol] || {}; const n = {...o, qty: p.qty, avg: p.avg, broker: b};
          if (p.symbol) n.symbol = p.symbol; else { delete n.symbol; n.isin = p.isin; } if (p.isin) n.isin = p.isin; delete n.yahoo; return n; });
        cfg.holdings = [...keep, ...fresh];
        const blob = await encrypt(cfg, PW);
        await gh("contents/holdings.enc.json", {method: "PUT", body: JSON.stringify({message: `Import ${b} holdings`, sha: file.sha,
          content: btoa(JSON.stringify(blob))})});
        $("iprev").innerHTML = ""; PARSED = null;
        $("imsg").innerHTML = `<div class="alert a-g"><span>✅</span><div>Saved. The dashboard refreshes with the new holdings in about 2 minutes. Pull down or reopen to see it.</div></div>`;
      } catch (err) { $("isave").disabled = false; $("imsg").innerHTML = `<span class="err">${esc(err.message)}</span>`; }
    };
  };
}
function openImport() { renderImport(); $("import").style.display = "block"; history.pushState({i: 1}, ""); }

// ---------- shell
function go(tab) {
  TAB = tab; TABS.forEach(([k, l]) => $("tab-" + k).classList.toggle("hidden", k !== tab));
  $("title").textContent = TABS.find(t => t[0] === tab)[1];
  $("nav").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.t === tab));
  ({home: renderHome, holdings: renderHoldings, signals: renderSignals, health: renderHealth, market: renderMarket})[tab]();
  window.scrollTo(0, 0);
}
function start(d) {
  D = d; D.holdings.forEach(h => h.broker ||= "Kite");
  $("lockwrap").classList.add("hidden"); $("app").classList.remove("hidden");
  $("upd").textContent = `Updated ${d.updated} · NSE file ${d.sources?.NSE || "not available"}`;
  $("nav").innerHTML = TABS.map(([k, l]) => `<button data-t="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round">${ICONS[k]}</svg>${l}</button>`).join("");
  $("nav").onclick = e => { const b = e.target.closest("button"); if (b) go(b.dataset.t); };
  document.body.addEventListener("click", e => { const el = e.target.closest("[data-s]"); if (el && !$("app").classList.contains("hidden")) openDetail(el.dataset.s); });
  $("importBtn").onclick = openImport;
  if (d.errors?.length) $("err").textContent = "Couldn't fetch: " + d.errors.join("; ");
  go("home");
}
let BLOB = null;
async function unlock(pw, remember) {
  try { const d = await decrypt(BLOB, pw); PW = pw; if (remember) store.set("dash_pw", pw); start(d); }
  catch { $("lockmsg").textContent = "Wrong password."; store.del("dash_pw"); }
}
$("lock").addEventListener("submit", e => { e.preventDefault(); $("lockmsg").textContent = "Unlocking…"; unlock($("pw").value, $("rem").checked); });
fetch("data.enc.json?" + Date.now()).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(b => {
  BLOB = b; $("lockmsg").textContent = ""; const s = store.get("dash_pw"); if (s) unlock(s, false);
}).catch(e => { $("lockmsg").textContent = "No data yet: run the 'Update dashboard' workflow once. (" + e.message + ")"; });
</script>
